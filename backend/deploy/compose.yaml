name: harness-dev
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: "${ADMIN__DB:?set dev db}"
      POSTGRES_USER: "${ADMIN__USER:?set dev user}"
      POSTGRES_PASSWORD: "${ADMIN__PASSWORD:?set dev password}"

    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
