name: CI

on:
  push:
    branches:
      - master
      - -dev
    pull_request:
      branches:
        - master
        - dev
    workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ENV: test

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v7

      - name: 2. 安装 uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 3. 安装 Python
        run: uv python install

      - name: 4. 安装依赖
        run: uv sync --locked

      - name: 5. 缓存 mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-mypy-

      - name: 6. 缓存 pytest
        uses: actions/cache@v4
        with:
          path: .pytest_cache
          key: ${{ runner.os }}-pytest-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pytest-

      - name: 7. Ruff 静态检查
        run: uv run ruff check --output-format=github app tests

      - name: 8. Ruff 格式检查
        run: uv run ruff format --check app tests

      - name: 9. mypy 类型检查
        run: uv run mypy

      - name: 10. 单元与普通集成测试
        run: uv run pytest -q